# Created on the local lucene11-upgrade-experiment branch; not for upstream until Lucene 11 GA.
title: >
  Upgrade to Lucene 11. Some Lucene merge-policy settings were removed: `maxMergeAtOnce` and
  `noCFSRatio` are no longer accepted and are ignored with a warning if left in a `mergePolicyFactory`
  configuration. Compound-file selection is now controlled by the `<useCompoundFile>` and the new
  `<maxCFSSegmentSizeMB>` `<indexConfig>` settings, which apply to both newly written and merged
  segments.
type: changed
